name: Feature request
description: Suggest a new capability or an improvement (model support, API, performance, tooling).
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! English or French is fine. For larger changes, let's agree on the approach here before a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. API shape, setting name or command if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, other tools that do it, other designs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - OpenAI API / tool calling
        - Performance (prefill, decode, KV cache, MTP)
        - Memory guardian / admission
        - Models / catalog
        - Agent harness (OpenCode)
        - Web UI
        - CLI / install / LaunchAgent
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
