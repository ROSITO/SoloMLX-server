[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxserve"
version = "0.1.0"
description = "Minimal Apple Silicon OpenAI-compatible MLX server."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.10.0",
  "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "PyJWT>=2.8.0",
]
mlx = [
  "mlx-lm>=0.26.0",
]
security = [
  "PyJWT>=2.8.0",
]
rd = [
  "torch>=2.4.0",
  "transformers>=4.46.0",
  "safetensors>=0.4.0",
  "huggingface_hub>=0.30.0",
]

[project.scripts]
mlxserve = "mlxserve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
